name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: oven-sh/setup-bun@v2
      - run: cd zig && zig build test
      - run: cd rust && rustup toolchain install
      - run: cd rust && cargo test
      - run: bun run build:zig
      - run: bun run build:rust
      - run: bun run roms
      - run: bun run diff
